<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="سلّم التعرّض التدريجي"><defs><style>
 text{font-family:'Noto Sans Arabic','DejaVu Sans',Arial,sans-serif} .node{transition:opacity .2s ease, transform .2s ease;transform-box:fill-box;transform-origin:center;cursor:help} .node:hover{opacity:.82;transform:scale(1.035)} .pulse{animation: breathe 4s ease-in-out infinite} @keyframes breathe{50%{opacity:.65}}
 </style><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A0B3C8"/></marker></defs>
 <rect x="0" y="0" width="1200" height="720" rx="0" fill="#F6F9FD" stroke="none"/><rect x="42" y="44" width="6" height="73" rx="3" fill="#13A59B" stroke="none"/><text x="1120" y="76" font-size="17" font-weight="700" fill="#13A59B" text-anchor="start" direction="rtl" unicode-bidi="plaintext">التقنيات السلوكية</text><text x="1120" y="120" font-size="36" font-weight="750" fill="#183049" text-anchor="start" direction="rtl" unicode-bidi="plaintext">سلّم التعرّض التدريجي</text>
 <g class="node"><rect x="115" y="525" width="223" height="78" rx="16" fill="#E6F1FE" stroke="none"/><text x="226" y="554" font-size="18" font-weight="750" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الخطوة ١</text><text x="226" y="581" font-size="15" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">شرح فكرة لشخص موثوق</text></g><g class="node"><rect x="365" y="426" width="223" height="78" rx="16" fill="#E6F5F1" stroke="none"/><text x="476" y="455" font-size="18" font-weight="750" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الخطوة ٢</text><text x="476" y="482" font-size="15" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">التحدث أمام شخصين</text></g><g class="node"><rect x="615" y="327" width="223" height="78" rx="16" fill="#F1EBFA" stroke="none"/><text x="726" y="356" font-size="18" font-weight="750" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الخطوة ٣</text><text x="726" y="383" font-size="15" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">عرض قصير أمام فريق صغير</text></g><g class="node"><rect x="865" y="228" width="223" height="78" rx="16" fill="#FFF0E1" stroke="none"/><text x="976" y="257" font-size="18" font-weight="750" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الخطوة ٤</text><text x="976" y="284" font-size="15" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تقديم عرض أطول حسب الحاجة</text></g><text x="610" y="225" font-size="23" font-weight="500" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">التقدم تدريجي ومناسب للحالة، ولا يعني تعريض النفس لخطر حقيقي.</text><line x1="60" y1="658" x2="1140" y2="658" stroke="#DAE4EF" stroke-width="2" stroke-linecap="round" /><text x="1120" y="686" font-size="15" font-weight="400" fill="#60768D" text-anchor="start" direction="rtl" unicode-bidi="plaintext">رسم تعليمي مبسّط · العلاج المعرفي السلوكي (CBT)</text></svg>