<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="الموجات الثلاث لتطور العلاج المعرفي السلوكي"><defs><style>
 text{font-family:'Noto Sans Arabic','DejaVu Sans',Arial,sans-serif} .node{transition:opacity .2s ease, transform .2s ease;transform-box:fill-box;transform-origin:center;cursor:help} .node:hover{opacity:.82;transform:scale(1.035)} .pulse{animation: breathe 4s ease-in-out infinite} @keyframes breathe{50%{opacity:.65}}
 </style><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A0B3C8"/></marker></defs>
 <rect x="0" y="0" width="1200" height="720" rx="0" fill="#F6F9FD" stroke="none"/><rect x="42" y="44" width="6" height="73" rx="3" fill="#13A59B" stroke="none"/><text x="1120" y="76" font-size="17" font-weight="700" fill="#13A59B" text-anchor="start" direction="rtl" unicode-bidi="plaintext">التطور التاريخي</text><text x="1120" y="120" font-size="36" font-weight="750" fill="#183049" text-anchor="start" direction="rtl" unicode-bidi="plaintext">الموجات الثلاث لتطور العلاج المعرفي السلوكي</text>
 <g class="node"><rect x="85" y="265" width="290" height="180" rx="22" fill="white" stroke="#E0E8F1"/><rect x="93" y="273" width="7" height="164" rx="3" fill="#3979E5" stroke="none"/><circle cx="343" cy="297" r="17" fill="#3979E5"/><text x="343" y="304" font-size="17" font-weight="700" fill="white" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">1</text><text x="230.0" y="314" font-size="25" font-weight="700" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الموجة الأولى</text><text x="230.0" y="348" font-size="18" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">التعلم والتعزيز والتعرض</text></g><text x="230" y="480" font-size="22" font-weight="700" fill="#3979E5" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">1950–1960</text><path d="M 380 350 H442" stroke="#A0B3C8" stroke-width="4" marker-end="url(#arrow)"/><g class="node"><rect x="455" y="265" width="290" height="180" rx="22" fill="white" stroke="#E0E8F1"/><rect x="463" y="273" width="7" height="164" rx="3" fill="#8060CE" stroke="none"/><circle cx="713" cy="297" r="17" fill="#8060CE"/><text x="713" y="304" font-size="17" font-weight="700" fill="white" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">2</text><text x="600.0" y="314" font-size="25" font-weight="700" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الموجة الثانية</text><text x="600.0" y="348" font-size="18" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الأفكار والمعتقدات والسلوك</text></g><text x="600" y="480" font-size="22" font-weight="700" fill="#8060CE" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">1960–1970</text><path d="M 750 350 H812" stroke="#A0B3C8" stroke-width="4" marker-end="url(#arrow)"/><g class="node"><rect x="825" y="265" width="290" height="180" rx="22" fill="white" stroke="#E0E8F1"/><rect x="833" y="273" width="7" height="164" rx="3" fill="#13A59B" stroke="none"/><circle cx="1083" cy="297" r="17" fill="#13A59B"/><text x="1083" y="304" font-size="17" font-weight="700" fill="white" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">3</text><text x="970.0" y="314" font-size="25" font-weight="700" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الموجة الثالثة</text><text x="970.0" y="348" font-size="18" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">التقبل واليقظة والقيم</text></g><text x="970" y="480" font-size="22" font-weight="700" fill="#13A59B" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">لاحقًا</text><rect x="130" y="538" width="940" height="62" rx="18" fill="#E8F1FC" stroke="none"/><text x="600" y="577" font-size="22" font-weight="500" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الموجات متداخلة؛ لا تمثل استبدالًا كاملًا لما سبقها.</text><line x1="60" y1="658" x2="1140" y2="658" stroke="#DAE4EF" stroke-width="2" stroke-linecap="round" /><text x="1120" y="686" font-size="15" font-weight="400" fill="#60768D" text-anchor="start" direction="rtl" unicode-bidi="plaintext">رسم تعليمي مبسّط · العلاج المعرفي السلوكي (CBT)</text></svg>