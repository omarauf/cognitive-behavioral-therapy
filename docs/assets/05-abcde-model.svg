i="plaintext">حزن وانسحاب</text></g><path d="M728 365 h18" stroke="#A0B3C8" stroke-width="3" marker-end="url(#arrow)"/><g class="node"><rect x="748" y="270" width="210" height="200" rx="20" fill="white" stroke="#DCE6F2"/><rect x="748" y="270" width="210" height="49" rx="18" fill="#F09B4E" stroke="none"/><text x="853" y="305" font-size="27" font-weight="750" fill="white" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">D</text><text x="853" y="375" font-size="23" font-weight="750" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">المناقشة</text><text x="853" y="425" font-size="18" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">هل لدي دليل كافٍ؟</text></g><path d="M959 365 h18" stroke="#A0B3C8" stroke-width="3" marker-end="url(#arrow)"/><g class="node"><rect x="979" y="270" width="210" height="200" rx="20" fill="white" stroke="#DCE6F2"/><rect x="979" y="270" width="210" height="49" rx="18" fill="#13A59B" stroke="none"/><text x="1084" y="305" font-size="27" font-weight="750" fill="white" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">E</text><text x="1084" y="375" font-size="23" font-weight="750" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">البديل الفعّال</text><text x="1084" y="425" font-size="18" font-weight="500" fill="#60768D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">قد يكون مشغولًا</text></g><rect x="135" y="518" width="930" height="65" rx="16" fill="#E6F3F1" stroke="none"/><text x="600" y="561" font-size="19" font-weight="500" fill="#183049" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الفكرة ليست التفكير الإيجابي القسري؛ بل اختبار التفسير وتطوير موقف واقعي.</text><line x1="60" y1="658" x2="1140" y2="658" stroke="#DAE4EF" stroke-width="2" stroke-linecap="round" /><text x="1120" y="686" font-size="15" font-weight="400" fill="#60768D" text-anchor="start" direction="rtl" unicode-bidi="plaintext">